<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Corner — Verified Property Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: #0F172A;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .fc-carousel-container {
      width: 100%;
      max-width: 680px;
      position: relative;
    }
    .fc-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: none;
    }
    .fc-card.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fc-image-box {
      position: relative;
      width: 100%;
      height: 260px;
      background: #0F172A;
      overflow: hidden;
    }
    .fc-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .fc-card:hover .fc-image-box img {
      transform: scale(1.02);
    }
    .fc-badge-strip {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 2;
    }
    .fc-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.01em;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .fc-badge-verified {
      background: rgba(16, 185, 129, 0.95);
      color: #FFFFFF;
    }
    .fc-badge-rera {
      background: rgba(15, 23, 42, 0.85);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .fc-content {
      padding: 20px 22px;
    }
    .fc-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 12px;
    }
    .fc-typology {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .fc-price-tag {
      font-size: 22px;
      font-weight: 800;
      color: #6D001A;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .fc-project-sub {
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fc-project-sub .fc-dot {
      color: #CBD5E1;
    }
    .fc-specs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #F8FAFC;
      border: 1px solid #F1F5F9;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .fc-spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .fc-spec-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .fc-spec-val {
      font-size: 13px;
      font-weight: 700;
      color: #0F172A;
    }
    .fc-location-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748B;
      margin-bottom: 20px;
    }
    .fc-location-row svg {
      color: #6D001A;
      flex-shrink: 0;
    }
    .fc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .fc-btn {
      flex: 1;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .fc-btn-primary {
      background: #6D001A;
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(109, 0, 26, 0.2);
    }
    .fc-btn-primary:hover {
      background: #550014;
      transform: translateY(-1px);
    }
    .fc-btn-secondary {
      background: #FFFFFF;
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .fc-btn-secondary:hover {
      background: #F8FAFC;
      border-color: #94A3B8;
    }
    .fc-carousel-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 4px;
    }
    .fc-nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0F172A;
      transition: all 0.15s ease;
    }
    .fc-nav-btn:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
    }
    .fc-nav-dots {
      display: flex;
      gap: 6px;
    }
    .fc-dot-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #CBD5E1;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .fc-dot-indicator.active {
      background: #6D001A;
      width: 18px;
      border-radius: 4px;
    }
    /* Blueprint Modal */
    .fc-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .fc-modal-overlay.open {
      display: flex;
    }
    .fc-modal-box {
      max-width: 900px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    .fc-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #E2E8F0;
    }
    .fc-modal-body {
      padding: 16px;
      max-height: 80vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      background: #F8FAFC;
    }
    .fc-modal-body img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="fc-carousel-container" id="fc-carousel-wrapper">
    <div id="fc-cards-list"></div>
    <div class="fc-carousel-nav" id="fc-carousel-nav" style="display: none;">
      <button class="fc-nav-btn" onclick="prevCard()" aria-label="Previous">&larr;</button>
      <div class="fc-nav-dots" id="fc-dots-container"></div>
      <button class="fc-nav-btn" onclick="nextCard()" aria-label="Next">&rarr;</button>
    </div>
  </div>

  <!-- Blueprint Modal -->
  <div class="fc-modal-overlay" id="fc-blueprint-modal" onclick="closeBlueprintModal(event)">
    <div class="fc-modal-box" onclick="event.stopPropagation()">
      <div class="fc-modal-header">
        <strong id="fc-modal-title" style="font-size: 15px; color: #0F172A;">Architectural Blueprint</strong>
        <button onclick="closeBlueprintModal()" style="border: none; background: transparent; font-size: 20px; cursor: pointer; color: #64748B;">&times;</button>
      </div>
      <div class="fc-modal-body">
        <img id="fc-modal-img" src="" alt="Architectural Blueprint" />
      </div>
    </div>
  </div>

  <script>
    let propertiesData = [];
    let currentIndex = 0;

    // Default fallback property for direct iframe preview
    const DEFAULT_PROPERTY = {
      title: "5 BHK Villa",
      project_name: "Sahith Home",
      developer: "Sahith",
      badge: "Direct Developer Verified",
      rera_id: "P00909098668777",
      built_up_area_sqft: 10000,
      carpet_area_sqft: 6000,
      carpet_efficiency_pct: 60.0,
      location: "Manikonda, Hyderabad",
      price_formatted: "₹2.24 Cr",
      facing: "East",
      hero_image_url: "https://four-corner-mcp.onrender.com/assets/luxury_tower.jpg",
      walkthrough_video_url: "https://www.youtube.com/watch?v=F3zW6WJ3q6w",
      floor_plan_url: "https://four-corner-mcp.onrender.com/assets/floor_plan_blueprint.jpg",
      brochure_pdf_url: "https://four-corner-mcp.onrender.com/assets/sahith_home_luxury_villas_brochure.pdf"
    };

    function renderCards(data) {
      if (!data) return;
      
      let items = [];
      if (Array.isArray(data)) {
        items = data;
      } else if (data.housing_cards && Array.isArray(data.housing_cards)) {
        items = data.housing_cards;
      } else if (data.properties && Array.isArray(data.properties)) {
        items = data.properties.map(p => ({
          title: (p.bhk % 1 === 0 ? p.bhk : p.bhk) + " BHK " + (p.bhk >= 5 ? "Villa" : "Flat"),
          project_name: p.project_name,
          developer: p.developer,
          badge: "Direct Developer Verified",
          rera_id: p.rera_id,
          built_up_area_sqft: p.super_built_up_sqft,
          carpet_area_sqft: p.carpet_area_sqft,
          carpet_efficiency_pct: p.usable_efficiency_pct,
          location: p.micro_market + ", Hyderabad",
          price_formatted: "₹" + p.total_price_cr + " Cr",
          facing: p.facing,
          hero_image_url: p.hero_image_url,
          walkthrough_video_url: p.walkthrough_video_url,
          floor_plan_url: p.floor_plan_image_url,
          brochure_pdf_url: p.brochure_pdf_url
        }));
      }

      if (!items || items.length === 0) {
        items = [DEFAULT_PROPERTY];
      }

      propertiesData = items;
      currentIndex = 0;

      const container = document.getElementById("fc-cards-list");
      const nav = document.getElementById("fc-carousel-nav");
      const dotsContainer = document.getElementById("fc-dots-container");

      container.innerHTML = "";
      dotsContainer.innerHTML = "";

      propertiesData.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "fc-card" + (idx === 0 ? " active" : "");
        card.id = "fc-card-" + idx;

        const builtUp = p.built_up_area_sqft ? p.built_up_area_sqft.toLocaleString() + " sq.ft" : "N/A";
        const carpet = p.carpet_area_sqft ? p.carpet_area_sqft.toLocaleString() + " sq.ft" : "N/A";
        const efficiency = p.carpet_efficiency_pct ? p.carpet_efficiency_pct + "%" : "60%";
        const facing = p.facing ? p.facing + " Facing" : "East Facing";

        card.innerHTML = `
          <div class="fc-image-box">
            <img src="${p.hero_image_url || 'https://four-corner-mcp.onrender.com/assets/luxury_tower.jpg'}" alt="${p.project_name}" loading="lazy" />
            <div class="fc-badge-strip">
              <span class="fc-badge fc-badge-verified">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Direct Developer Verified
              </span>
              <span class="fc-badge fc-badge-rera">TS-RERA ${p.rera_id || 'Sanctioned'}</span>
            </div>
          </div>
          <div class="fc-content">
            <div class="fc-header-row">
              <div class="fc-typology">${p.title || 'Residential Unit'}</div>
              <div class="fc-price-tag">${p.price_formatted || '₹2.24 Cr'}</div>
            </div>
            <div class="fc-project-sub">
              <span>${p.project_name}</span>
              <span class="fc-dot">&bull;</span>
              <span>${p.developer || 'Direct Builder'}</span>
            </div>
            <div class="fc-specs-grid">
              <div class="fc-spec-item">
                <span class="fc-spec-label">Built-Up Area</span>
                <span class="fc-spec-val">${builtUp}</span>
              </div>
              <div class="fc-spec-item">
                <span class="fc-spec-label">Carpet Area</span>
                <span class="fc-spec-val">${carpet} (${efficiency})</span>
              </div>
              <div class="fc-spec-item">
                <span class="fc-spec-label">Orientation</span>
                <span class="fc-spec-val">${facing}</span>
              </div>
            </div>
            <div class="fc-location-row">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>${p.location || 'Hyderabad'}</span>
            </div>
            <div class="fc-actions">
              <a href="${p.walkthrough_video_url || '#'}" target="_blank" rel="noopener noreferrer" class="fc-btn fc-btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                View details & 4K Tour
              </a>
              <button type="button" onclick="openBlueprintModal('${p.floor_plan_url || 'https://four-corner-mcp.onrender.com/assets/floor_plan_blueprint.jpg'}', '${p.project_name} Floor Plan')" class="fc-btn fc-btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Floor Plan Blueprint
              </button>
              <a href="${p.brochure_pdf_url || '#'}" target="_blank" rel="noopener noreferrer" class="fc-btn fc-btn-secondary" style="flex: 0 0 auto; min-width: 44px; padding: 10px 14px;" title="Official Developer Brochure">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);

        const dot = document.createElement("div");
        dot.className = "fc-dot-indicator" + (idx === 0 ? " active" : "");
        dot.onclick = () => showCard(idx);
        dotsContainer.appendChild(dot);
      });

      if (propertiesData.length > 1) {
        nav.style.display = "flex";
      } else {
        nav.style.display = "none";
      }
    }

    function showCard(idx) {
      if (idx < 0) idx = propertiesData.length - 1;
      if (idx >= propertiesData.length) idx = 0;
      currentIndex = idx;

      document.querySelectorAll(".fc-card").forEach((c, i) => {
        c.classList.toggle("active", i === currentIndex);
      });
      document.querySelectorAll(".fc-dot-indicator").forEach((d, i) => {
        d.classList.toggle("active", i === currentIndex);
      });
    }

    function prevCard() { showCard(currentIndex - 1); }
    function nextCard() { showCard(currentIndex + 1); }

    function openBlueprintModal(url, title) {
      document.getElementById("fc-modal-title").textContent = title || "Architectural Blueprint";
      document.getElementById("fc-modal-img").src = url;
      document.getElementById("fc-blueprint-modal").classList.add("open");
    }

    function closeBlueprintModal() {
      document.getElementById("fc-blueprint-modal").classList.remove("open");
    }

    // 1. MCP Apps PostMessage Bridge (JSON-RPC)
    window.addEventListener("message", (event) => {
      if (event.data?.method === "ui/notifications/tool-result") {
        renderCards(event.data.params);
      } else if (event.data?.toolOutput) {
        renderCards(event.data.toolOutput);
      }
    });

    // 2. OpenAI Apps SDK window.openai Bridge
    if (window.openai?.toolOutput) {
      renderCards(window.openai.toolOutput);
    } else {
      // 3. Fallback: Parse URL params or render default
      const qp = new URLSearchParams(window.location.search);
      const projectName = qp.get("project_name");
      const unitId = qp.get("unit_id");

      if (projectName || unitId) {
        fetch(`/api/v1/properties/search?` + qp.toString())
          .then(r => r.json())
          .then(data => renderCards(data))
          .catch(() => renderCards([DEFAULT_PROPERTY]));
      } else {
        renderCards([DEFAULT_PROPERTY]);
      }
    }
  </script>
</body>
</html>
