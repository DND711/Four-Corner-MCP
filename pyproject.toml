[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "four-corner-mcp"
version = "0.1.0"
description = "Four Corner MCP Server - Property Intelligence & Verified Real Estate Discovery for AI Assistants"
readme = "README.md"
authors = [{ name = "Four Corner Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
four-corner-mcp = "four_corner.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["four_corner*"]
